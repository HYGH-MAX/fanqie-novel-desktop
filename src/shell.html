<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>番茄小说</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden; background: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #1f1f1f;
  }
  .bar {
    height: 40px; display: flex; align-items: center; padding-left: 12px;
    background: #fff; border-bottom: 1px solid #ececec;
    -webkit-app-region: drag; user-select: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex: none; }
  .brand img { width: 20px; height: 20px; border-radius: 5px; }
  .brand .name { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
  .brand .tag {
    font-size: 10px; color: #a26b45; background: #fff1e8;
    border-radius: 4px; padding: 1px 5px;
  }
  .chips { display: flex; gap: 6px; margin-left: 10px; flex: none; }
  .chip {
    font-size: 11px; color: #ff5a1f; background: #fff2eb;
    border: 1px solid #ffd9c7; border-radius: 10px; padding: 1px 8px;
    display: none; line-height: 16px;
  }
  .drag { flex: 1; height: 100%; }
  .actions { display: flex; align-items: center; height: 100%; -webkit-app-region: no-drag; }
  button {
    appearance: none; border: 0; background: transparent;
    height: 32px; width: 36px; margin: 0 2px; border-radius: 6px;
    color: #555; display: grid; place-items: center; cursor: pointer;
    transition: background .15s, color .15s;
  }
  button:hover { background: #f4f4f4; color: #111; }
  button.active { color: #ff5a1f; background: #fff2eb; }
  .sep { width: 1px; height: 18px; background: #e8e8e8; margin: 0 6px; }
  .win { margin: 0; width: 44px; height: 40px; border-radius: 0; }
  .win:hover { background: #ececec; }
  .close:hover { background: #e81123; color: #fff; }
  svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <img src="icon.png" alt="">
      <span class="name">番茄小说</span>
      <span class="tag">电脑版</span>
    </div>
    <div class="chips">
      <span class="chip" id="chip-pin">已置顶</span>
      <span class="chip" id="chip-eye">护眼</span>
    </div>
    <div class="drag"></div>
    <div class="actions">
      <button id="btn-pin" title="置顶（Ctrl+Shift+P）">
        <svg viewBox="0 0 24 24"><path d="M9 4h6"/><path d="M12 4v6"/><path d="M8.4 10h7.2l1.1 3.6H7.3z"/><path d="M12 13.6V20"/></svg>
      </button>
      <button id="btn-full" title="全屏（F11）">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
      </button>
      <button id="btn-recent" title="最近阅读">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5v5l3.4 2"/></svg>
      </button>
      <button id="btn-settings" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.2M12 18.6v2.2M3.2 12h2.2M18.6 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6L5.8 18.2"/></svg>
      </button>
      <span class="sep"></span>
      <button class="win" id="btn-min" title="最小化">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button class="win" id="btn-max" title="最大化">
        <svg viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="1.2"/></svg>
      </button>
      <button class="win close" id="btn-close" title="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id)
  const ICON_MAX = '<svg viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="1.2"/></svg>'
  const ICON_RESTORE = '<svg viewBox="0 0 24 24"><rect x="4.5" y="7.5" width="11" height="11" rx="1.2"/><path d="M8.5 7.5v-3h11v11h-3"/></svg>'

  function render(state) {
    if (!state) return
    $('chip-pin').style.display = state.pinned ? 'inline-block' : 'none'
    $('chip-eye').style.display = state.eyeCare ? 'inline-block' : 'none'
    $('btn-pin').classList.toggle('active', !!state.pinned)
    $('btn-max').innerHTML = state.maximized ? ICON_RESTORE : ICON_MAX
    $('btn-max').title = state.maximized ? '还原' : '最大化'
  }

  window.fq.onState(render)
  window.fq.state().then(render)

  $('btn-min').onclick = () => window.fq.minimize()
  $('btn-max').onclick = () => window.fq.toggleMax()
  $('btn-close').onclick = () => window.fq.close()
  $('btn-pin').onclick = () => window.fq.pin().then(render)
  $('btn-full').onclick = () => window.fq.fullscreen().then(render)
  $('btn-recent').onclick = () => window.fq.openRecent()
  $('btn-settings').onclick = () => window.fq.openSettings()
</script>
</body>
</html>
