<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>设置 - 番茄小说</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: #fff; color: #1f1f1f; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 13px;
  }
  .head {
    height: 42px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 0 0 18px; border-bottom: 1px solid #eee;
    -webkit-app-region: drag; user-select: none;
  }
  .head .title { font-size: 14px; font-weight: 600; }
  .head button {
    -webkit-app-region: no-drag; appearance: none; border: 0; background: transparent;
    width: 42px; height: 42px; cursor: pointer; color: #666; display: grid; place-items: center;
  }
  .head button:hover { background: #e81123; color: #fff; }
  .head button svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; }
  .body { height: calc(100% - 42px); overflow-y: auto; padding: 6px 18px 18px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid #f4f4f4;
  }
  .row:last-child { border-bottom: 0; }
  .row .t { font-size: 13px; font-weight: 500; }
  .row .d { font-size: 11.5px; color: #999; margin-top: 4px; line-height: 1.5; word-break: break-all; }
  .row .ops { display: flex; gap: 8px; flex: none; }
  .ghost {
    appearance: none; border: 1px solid #e3e3e3; background: #fff; color: #444;
    border-radius: 8px; height: 30px; padding: 0 12px; cursor: pointer; font-size: 12px;
  }
  .ghost:hover { border-color: #ff5a1f; color: #ff5a1f; }
  select {
    appearance: none; border: 1px solid #e3e3e3; border-radius: 8px; height: 30px;
    padding: 0 10px; font-size: 12px; color: #333; background: #fff; cursor: pointer; outline: none;
  }
  select:focus { border-color: #ff5a1f; }
  .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #d8d8d8; border-radius: 12px;
    transition: background .18s; cursor: pointer;
  }
  .slider::after {
    content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; left: 3px; top: 3px; transition: transform .18s;
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  .switch input:checked + .slider { background: #ff5a1f; }
  .switch input:checked + .slider::after { transform: translateX(18px); }
  .notice {
    display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #fff6f1; border: 1px solid #ffe0d2; color: #8a4a25; font-size: 12px;
  }
  .notice .line { margin-bottom: 10px; }
  .notice button {
    appearance: none; border: 0; background: #ff5a1f; color: #fff; height: 30px;
    padding: 0 16px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  .notice button:hover { background: #e94d15; }
  .foot {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid #f4f4f4;
    font-size: 11.5px; color: #aaa; line-height: 1.7;
  }
  .foot a { color: #ff5a1f; text-decoration: none; }
</style>
</head>
<body>
  <div class="head">
    <span class="title">设置</span>
    <button id="btn-close" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
  </div>

  <div class="body">
    <div class="row">
      <div>
        <div class="t">数据目录</div>
        <div class="d" id="data-dir">读取中…</div>
      </div>
      <div class="ops">
        <button class="ghost" id="open-dir">打开</button>
        <button class="ghost" id="choose-dir">更改</button>
      </div>
    </div>

    <div class="row">
      <div>
        <div class="t">页面缩放</div>
        <div class="d">调整正文与页面的显示比例</div>
      </div>
      <select id="zoom">
        <option value="0.8">80%</option>
        <option value="0.9">90%</option>
        <option value="1">100%</option>
        <option value="1.1">110%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
      </select>
    </div>

    <div class="row">
      <div>
        <div class="t">护眼模式</div>
        <div class="d">给页面加暖色滤镜，夜里看着舒服些</div>
      </div>
      <label class="switch"><input type="checkbox" id="eye-care"><span class="slider"></span></label>
    </div>

    <div class="row">
      <div>
        <div class="t">窗口置顶</div>
        <div class="d">边工作边看，快捷键 Ctrl + Shift + P</div>
      </div>
      <label class="switch"><input type="checkbox" id="always-on-top"><span class="slider"></span></label>
    </div>

    <div class="row">
      <div>
        <div class="t">关闭时最小化到托盘</div>
        <div class="d">点 × 不退出程序，从托盘再唤回来</div>
      </div>
      <label class="switch"><input type="checkbox" id="close-to-tray"><span class="slider"></span></label>
    </div>

    <div class="row">
      <div>
        <div class="t">开机自启</div>
        <div class="d">登录系统后自动打开</div>
      </div>
      <label class="switch"><input type="checkbox" id="auto-launch"><span class="slider"></span></label>
    </div>

    <div class="notice" id="notice">
      <div class="line" id="notice-text"></div>
      <button id="btn-restart">立即重启</button>
    </div>

    <div class="foot">
      番茄小说电脑版 v<span id="ver">-</span><br>
      非官方桌面外壳，内容、账号与进度均来自番茄小说官网，版权归番茄小说及原作者所有。
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id)
  let current = {}

  function fill(settings, state) {
    current = settings
    $('data-dir').textContent = settings.dataDir || ''
    $('data-dir').title = settings.dataDir || ''
    $('zoom').value = String(settings.zoomFactor)
    $('eye-care').checked = !!settings.eyeCare
    $('always-on-top').checked = !!settings.alwaysOnTop
    $('close-to-tray').checked = !!settings.closeToTray
    $('auto-launch').checked = !!settings.autoLaunch
    if (state) $('ver').textContent = state.version
  }

  Promise.all([window.fq.settings(), window.fq.state()]).then(([s, st]) => fill(s, st))
  window.fq.onState((s) => { $('eye-care').checked = !!s.eyeCare; $('always-on-top').checked = !!s.pinned })

  $('btn-close').onclick = () => window.fq.close()
  $('open-dir').onclick = () => window.fq.openDataDir()

  $('choose-dir').onclick = async () => {
    const res = await window.fq.chooseDataDir()
    if (!res || !res.changed) return
    $('notice-text').textContent = '数据目录已改为 ' + res.dir + '，需要重启程序才会生效（登录状态会以新目录为准）。'
    $('notice').style.display = 'block'
  }

  $('btn-restart').onclick = () => window.fq.restart()

  $('zoom').onchange = (e) => window.fq.setSetting('zoomFactor', Number(e.target.value))
  $('eye-care').onchange = (e) => window.fq.setSetting('eyeCare', e.target.checked)
  $('always-on-top').onchange = (e) => window.fq.setSetting('alwaysOnTop', e.target.checked)
  $('close-to-tray').onchange = (e) => window.fq.setSetting('closeToTray', e.target.checked)
  $('auto-launch').onchange = (e) => window.fq.setSetting('autoLaunch', e.target.checked)
</script>
</body>
</html>
